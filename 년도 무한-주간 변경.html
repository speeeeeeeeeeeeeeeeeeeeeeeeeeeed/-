<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼구아이앤씨 울산피피사업장</title>
<style>
    body { font-family: system-ui, sans-serif; margin:0; padding:0; background:#f4f4f4; }
    .header { position: sticky; top: 0; background: #f4f4f4; z-index: 100; padding: 10px; border-bottom: 2px solid #999; text-align:center; }
    h2 { margin:4px 0 8px; font-size: 1.2rem; }
    .controls { display:flex; justify-content:center; gap:6px; flex-wrap: wrap; }
    .controls button, .controls select { padding:6px 10px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer; }
    .controls .active { background:#4a90e2; color:#fff; font-weight:bold; border-color:#4a90e2; }
    .month { margin-bottom:16px; padding:10px; }
    table { width:100%; border-collapse:collapse; background:#fff; table-layout:fixed; font-size:12px; }
    th, td { border:1px solid #ccc; text-align:center; padding:6px 2px; }
    .month-title { background:#333; color:#fff; font-weight:bold; }
    .day-sat { color:blue; background:#f0f7ff; }
    .day-sun { color:red; background:#fff0f0; }
    .rest { background:#ffcccc; color:red; font-weight:bold; } /* 휴무 빨간색 강조 */
    .m { background:#e8f0ff; }
    .s { background:#fff3cd; }
    .week { background:#4caf50; color:#fff; font-weight:bold; } /* 주간 초록색 강조 */
    .today-highlight { border: 2px solid #000 !important; background: #ffff00 !important; } /* 오늘 날짜 표시 */
</style>
</head>
<body>

<div class="header">
    <h2>삼구아이앤씨 울산피피사업장</h2>
    <div class="controls">
        <select id="yearSelect" onchange="changeYear()">
            <option value="2025">2025년</option>
            <option value="2026" selected>2026년</option>
            <option value="2027">2027년</option>
            <option value="2028">2028년</option>
            <option value="2029">2029년</option>
            <option value="2030">2030년</option>
        </select>
        <button id="btn0" class="active" onclick="filterTeam(0)">전체</button>
        <button id="btn1" onclick="filterTeam(1)">1조</button>
        <button id="btn2" onclick="filterTeam(2)">2조</button>
        <button id="btn3" onclick="filterTeam(3)">3조</button>
    </div>
</div>

<div id="calendar"></div>

<script>
let currentYear = 2026;
let currentFilter = 0;

// 근무 기준 정보 (2026-01-23 1조가 M 첫날인 기준을 원점으로 계산)
const pattern = ["M","M","M","M","휴","휴","S","S","S","S","휴","휴"];
const anchorDate = new Date(2026, 0, 23); // 기준일
const anchorIdx = { 1: 0, 2: 8, 3: 4 }; // 기준일 당시 각 조의 패턴 인덱스

// 24일 주기 '주' 근무 기준일
const weekBase = {
    1: new Date(2026, 0, 3),
    2: new Date(2026, 0, 7),
    3: new Date(2026, 0, 11)
};

function buildCalendar(){
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";
    const today = new Date();
    today.setHours(0,0,0,0);

    for(let m=0; m<12; m++){
        const lastDay = new Date(currentYear, m+1, 0).getDate();

        for(let start=1; start<=lastDay; start+=10){
            let html = `<div class="month"><table>`;
            if(start === 1) html += `<tr><th colspan="11" class="month-title">${currentYear}년 ${m+1}월</th></tr>`;

            // DAY 행
            html += `<tr><th>일자</th>`;
            for(let i=0; i<10; i++){
                const d = start + i;
                html += d <= lastDay ? `<th>${d}</th>` : `<th></th>`;
            }
            html += `</tr>`;

            // 요일 행
            html += `<tr><th>요일</th>`;
            for(let i=0; i<10; i++){
                const d = start + i;
                if(d <= lastDay){
                    const date = new Date(currentYear, m, d);
                    const w = date.getDay();
                    const wd = ["일","월","화","수","목","금","토"][w];
                    let cls = w===6?"day-sat":w===0?"day-sun":"";
                    if(date.getTime() === today.getTime()) cls += " today-highlight";
                    html += `<th class="${cls}">${wd}</th>`;
                } else { html += `<th></th>`; }
            }
            html += `</tr>`;

            // 1, 2, 3조 근무 행
            for(let team=1; team<=3; team++){
                html += `<tr class="team${team}" style="display:${(currentFilter===0||currentFilter===team)?'':'none'}"><th>${team}조</th>`;
                for(let i=0; i<10; i++){
                    const d = start + i;
                    if(d <= lastDay){
                        const cur = new Date(currentYear, m, d);
                        
                        // 12일 패턴 계산
                        const diffDays = Math.round((cur - anchorDate) / (86400000));
                        let idx = (anchorIdx[team] + diffDays) % 12;
                        if(idx < 0) idx += 12;
                        let v = pattern[idx];

                        // 24일 '주' 근무 계산
                        const wdiff = Math.round((cur - weekBase[team]) / 86400000);
                        if(wdiff % 24 === 0) v = "주";

                        let cls = v==="휴"?"rest":v==="M"?"m":v==="S"?"s":v==="주"?"week":"";
                        html += `<td class="${cls}">${v}</td>`;
                    } else { html += `<td></td>`; }
                }
                html += `</tr>`;
            }
            html += `</table></div>`;
            cal.innerHTML += html;
        }
    }
}

function filterTeam(n){
    currentFilter = n;
    document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"));
    document.getElementById("btn"+n).classList.add("active");
    buildCalendar();
}

function changeYear(){
    currentYear = parseInt(document.getElementById("yearSelect").value);
    buildCalendar();
}

buildCalendar();
</script>
</body>
</html>
